// The chat core as a gRPC service: pkg/chat.ChatService one to one, for
// embedders that reach it from another language or another process. The
// service actor and configuration are the server's, exactly as with the
// embedded API: rooms are created with the actor as their owner, membership
// changes act as the actor, and Subscribe reads as the actor.
syntax = "proto3";

package klacks.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lioneljmorrison/klacks/api/gen/klacks/chat/v1;chatv1";

service ChatService {
  // CreateRoom creates a room of the given kind with the service actor as
  // its owner and returns the generated room ID.
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);

  // AddMember adds user_id to room_id with role, acting as the service
  // actor.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // RemoveMember removes user_id from room_id, acting as the service actor.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // PostMessage publishes payload to room_id as sender_id and returns its
  // seq. Seqs are per room, gap-free and start at 1. Sender must be a
  // member.
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);

  // Subscribe streams the room's messages with seq > from_seq, exactly once
  // each and in seq order: every committed message above from_seq replayed,
  // then live delivery. from_seq 0 replays the whole room. The stream ends
  // when the client cancels, the service closes, a store error ends the
  // replay, or the consumer falls behind; the client resubscribes from the
  // last seq it received.
  rpc Subscribe(SubscribeRequest) returns (stream Message);

  // Device registration and prekey bundles (S-22). RegisterDevice upserts
  // the (user_id, device_id) bundle and its initial one-time prekeys;
  // DeviceBundle fetches a bundle and consumes one of its one-time prekeys
  // (S-23), deleted server-side so it is never handed out twice.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc DeviceBundle(DeviceBundleRequest) returns (DeviceBundleResponse);
  rpc AddDevicePrekeys(AddDevicePrekeysRequest) returns (AddDevicePrekeysResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
}

// UUIDs are raw 16 bytes. Kinds ("dm", "group", "space") and roles ("owner",
// "admin", "member") are the pkg/chat constants as strings; anything else is
// rejected with InvalidArgument.

message CreateRoomRequest {
  string kind = 1;
}

message CreateRoomResponse {
  bytes room_id = 1;
}

message AddMemberRequest {
  bytes room_id = 1;
  bytes user_id = 2;
  string role = 3;
}

message AddMemberResponse {}

message RemoveMemberRequest {
  bytes room_id = 1;
  bytes user_id = 2;
}

message RemoveMemberResponse {}

// EncryptedPayload is a message as the sender submits it. The server never
// sees plaintext: ciphertext and header are opaque.
message EncryptedPayload {
  bytes message_id = 1; // generated by the client
  bytes device_id = 2;  // the sending device; not verified yet
  bytes ciphertext = 3;
  bytes header = 4;
}

message PostMessageRequest {
  bytes room_id = 1;
  bytes sender_id = 2;
  EncryptedPayload payload = 3;
}

message PostMessageResponse {
  int64 seq = 1;
}

message SubscribeRequest {
  bytes room_id = 1;
  int64 from_seq = 2; // 0 replays the whole room
}

// Message is one stored message as delivered to a subscriber.
message Message {
  bytes room_id = 1;
  int64 seq = 2;
  bytes message_id = 3;
  bytes sender_id = 4;
  bytes device_id = 5;
  bytes ciphertext = 6;
  bytes header = 7;
  google.protobuf.Timestamp created_at = 8;
}

// PrekeyBundle is a device's uploaded X3DH prekey bundle, public keys only.
// The server validates shapes only: sizes, ids, counts. It never sees
// private key material and never verifies signatures.
message PrekeyBundle {
  bytes identity_key = 1;            // Ed25519 public key
  bytes identity_dh_key = 2;         // X25519 (Montgomery) form of the identity
  int64 signed_prekey_id = 3;        // per device, from 1
  bytes signed_prekey = 4;           // X25519 public key
  bytes signed_prekey_signature = 5; // Ed25519 signature
}

message Prekey {
  int64 id = 1;  // per device, from 1
  bytes key = 2; // X25519 public key
}

message RegisterDeviceRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  PrekeyBundle bundle = 3;
  repeated Prekey one_time_prekeys = 4;
}

message RegisterDeviceResponse {}

message DeviceBundleRequest {
  bytes user_id = 1;
  bytes device_id = 2;
}

// The response carries the bundle and the one-time prekey the fetch
// consumed; one_time_prekey is omitted when the device has none left.
// remaining is the device's count after the fetch, the fetcher's
// low-watermark signal to replenish.
message DeviceBundleResponse {
  PrekeyBundle bundle = 1;
  Prekey one_time_prekey = 2;
  int32 remaining = 3;
}

message AddDevicePrekeysRequest {
  bytes user_id = 1;
  bytes device_id = 2;
  repeated Prekey one_time_prekeys = 3;
}

message AddDevicePrekeysResponse {}

message Device {
  bytes device_id = 1;
  google.protobuf.Timestamp last_seen_at = 2; // omitted when never seen
}

message ListDevicesRequest {
  bytes user_id = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}
