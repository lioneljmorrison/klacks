# Local development stack: `make up` / `make down`.
# Host ports default to 55432 (Postgres, clear of a local install) and 9042
# (ScyllaDB); override with KLACKS_DEV_POSTGRES_PORT / KLACKS_DEV_SCYLLA_PORT.
name: klacks

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: klacks
      POSTGRES_PASSWORD: klacks
      POSTGRES_DB: klacks
    ports:
      - "127.0.0.1:${KLACKS_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klacks -d klacks"]
      interval: 2s
      timeout: 3s
      retries: 30

  scylla:
    image: scylladb/scylla:2026.3.5
    # Small, single-node developer settings (also fine on WSL2 / laptops).
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
    ports:
      - "127.0.0.1:${KLACKS_DEV_SCYLLA_PORT:-9042}:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  postgres-data:
  scylla-data:
