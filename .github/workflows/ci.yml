name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: vet, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Build
        run: make build
      - name: vet + lint + test
        run: make check
